<title>Dama · دامة</title>
<style>
  :root{
    --bg:#15110d; --panel:#1e1813;
    --frameA:#5a4026; --frameB:#3a2716; --frameLine:#27190e;
    --sqLight:#e6d2a8; --sqDark:#c69f6a; --wood:#dcc196; --grid:rgba(39,25,14,.4);
    --gold:#d9a441; --sel:#e07a3a; --accent:#8fae6b; --ink:#eee6d5; --muted:#a89a80;
    --lp1:#fdf3da; --lp2:#dcc191; --lp3:#b9975d; --dp1:#7a5a40; --dp2:#43301f; --dp3:#241609;
    --sz:min(94vw, calc(100vh - 296px), 700px); --cell:calc(var(--sz)/8);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;background:radial-gradient(120% 90% at 50% 0%,#221a12 0%,var(--bg) 60%);
     color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%;
     padding-top:env(safe-area-inset-top);}
  .wrap{max-width:740px;margin:0 auto;padding:16px 14px 34px;}
  .head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:8px;}
  h1{font-family:"Iowan Old Style",Georgia,"Times New Roman",serif;font-size:32px;margin:0;letter-spacing:.5px;color:#f4ecd8;}
  h1 .ar{font-weight:400;} h1 .sub{display:block;font-size:12px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-top:2px;}
  .headbtns{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
  .wordmark{font-family:"Iowan Old Style",Georgia,serif;font-size:22px;line-height:1;color:var(--gold);letter-spacing:1px;}
  .sdot{width:13px;height:13px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:7px;border:1px solid var(--frameLine);}
  .sdot.l{background:radial-gradient(circle at 35% 28%,#fbf1d8,#d8bd8e);}
  .sdot.d{background:radial-gradient(circle at 35% 28%,#6b4e37,#2a1a10);}
  .play{perspective:1200px;}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  select,.btn{background:var(--panel);color:var(--ink);border:1px solid #3a2f24;border-radius:9px;
     padding:8px 11px;font-size:13px;cursor:pointer;-webkit-appearance:none;appearance:none;}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
     background-position:calc(100% - 15px) center,calc(100% - 10px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px;}
  .btn:hover{border-color:var(--accent);} .btn:active{transform:translateY(1px);}
  .btn.primary{color:var(--accent);border-color:#3f4a30;}
  .btn.mini{padding:8px 10px;min-width:40px;text-align:center;}

  .tray{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;min-height:20px;}
  .caps{display:flex;flex-wrap:wrap;gap:2px;flex:1;}
  .caps.right{justify-content:flex-end;}
  .mini{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--frameLine);}
  .mini.l{background:radial-gradient(circle at 35% 28%,#fbf1d8,#d8bd8e);}
  .mini.d{background:radial-gradient(circle at 35% 28%,#6b4e37,#2a1a10);}
  .movebadge{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.5px;}

  .status{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:14px;min-height:22px;}
  .turn{display:flex;align-items:center;gap:9px;}
  .dot{width:18px;height:18px;border-radius:50%;display:inline-block;border:1px solid var(--frameLine);}
  .dot.l{background:radial-gradient(circle at 35% 28%,#fbf1d8,#d8bd8e 60%,#b9995f);}
  .dot.d{background:radial-gradient(circle at 35% 28%,#6b4e37,#3f2a1a 60%,#2a1a10);}
  .must{color:var(--sel);font-size:12px;} .thinking{color:var(--gold);font-size:12px;}
  .count{font-size:12px;color:var(--muted);letter-spacing:.5px;}
  .coach{min-height:18px;margin:-4px 0 10px;font-size:12.5px;letter-spacing:.3px;color:var(--muted);transition:color .2s;}
  .coach.best{color:#8fae6b;} .coach.good{color:#a9c07f;} .coach.inacc{color:#e0c045;}
  .coach.mistake{color:#e08a3a;} .coach.blunder{color:#e0563a;font-weight:600;}
  .stats{font-size:12px;color:var(--muted);letter-spacing:.3px;margin:-4px 0 10px;}

  .play{display:grid;grid-template-columns:16px var(--sz);grid-template-rows:var(--sz) 16px;gap:3px;justify-content:center;}
  .frame{grid-column:2;grid-row:1;background:linear-gradient(150deg,var(--frameA),var(--frameB));
     padding:8px;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);position:relative;}
  .board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
     border:1px solid var(--frameLine);border-radius:3px;overflow:hidden;position:relative;}
  .ranks{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:space-around;align-items:center;font-size:10px;color:var(--muted);}
  .files{grid-column:2;grid-row:2;display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--muted);padding:0 2px;}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 .5px var(--grid);}
  .sq.light{background:var(--sqLight);} .sq.dark{background:var(--sqDark);}
  .board.mono .sq{background:var(--wood);box-shadow:inset 0 0 0 .5px var(--grid);}
  .sq.last{box-shadow:inset 0 0 0 .5px var(--grid),inset 0 0 0 4px rgba(217,164,65,.32);}
  .sq.sel{box-shadow:inset 0 0 0 3px var(--sel);}
  .sq.moving{z-index:4;}
  .sq.pick,.sq.godest{cursor:pointer;}
  .piece{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;}
  .piece.l{background:radial-gradient(circle at 36% 27%,var(--lp1),var(--lp2) 58%,var(--lp3));
     box-shadow:inset 0 -3px 6px rgba(120,88,45,.55),inset 0 2px 3px rgba(255,255,255,.6),0 3px 5px rgba(0,0,0,.45);}
  .piece.d{background:radial-gradient(circle at 36% 27%,var(--dp1),var(--dp2) 58%,var(--dp3));
     box-shadow:inset 0 -3px 6px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.14),0 3px 5px rgba(0,0,0,.5);}
  .king::after{content:"✦";position:absolute;color:var(--gold);font-size:calc(var(--cell)*.46);line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.55);}
  .dest{width:calc(var(--cell)*.26);height:calc(var(--cell)*.26);border-radius:50%;background:rgba(224,122,58,.5);box-shadow:0 0 0 2px rgba(224,122,58,.25);}
  .destcap{position:absolute;inset:calc(var(--cell)*.07);border-radius:50%;box-shadow:inset 0 0 0 3px rgba(224,122,58,.9);}
  .pickdot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:rgba(143,174,107,.9);}
  @keyframes promote{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.28) rotate(180deg)}70%{transform:scale(1.08) rotate(360deg)}100%{transform:scale(1) rotate(360deg)}}
  @keyframes glow{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}
  .piece.promoting{animation:promote .62s ease;}
  .piece.promoting::before{content:"";position:absolute;inset:-22%;border-radius:50%;box-shadow:0 0 18px 5px rgba(217,164,65,.75);animation:glow .62s ease forwards;}

  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,11,8,.66);border-radius:12px;z-index:6;}
  .overlay.show{display:flex;}
  .card{background:var(--panel);border:1px solid #3a2f24;border-radius:14px;padding:22px 26px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .card h2{margin:0 0 4px;font-family:Georgia,serif;font-size:24px;color:var(--gold);} .card p{margin:0 0 14px;color:var(--muted);font-size:13px;}

  .rulesbtn{margin-top:16px;background:transparent;color:var(--muted);border:none;font-size:13px;cursor:pointer;text-decoration:underline;padding:0;}
  .rules{margin-top:8px;font-size:13.5px;line-height:1.65;color:#cdc3ae;} .rules ul{margin:6px 0;padding-left:18px;} .rules p{margin:6px 0;} .hidden{display:none;}
  [dir="rtl"] .rules ul{padding-left:0;padding-right:18px;}

  /* loading splash */
  .loading{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
     background:radial-gradient(120% 90% at 50% 0%,#221a12 0%,var(--bg) 60%);transition:opacity .5s ease;}
  .loading.gone{opacity:0;pointer-events:none;}
  .loadinner{text-align:center;}
  .lwm{font-family:"Iowan Old Style",Georgia,serif;font-size:64px;color:var(--gold);letter-spacing:2px;text-shadow:0 3px 12px rgba(0,0,0,.55);}
  .lsub{margin-top:10px;color:var(--accent);font-size:11px;letter-spacing:4px;text-transform:uppercase;}
  .lspin{width:34px;height:34px;margin:20px auto 0;border-radius:50%;border:3px solid rgba(217,164,65,.22);border-top-color:var(--gold);animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* hint / assist button */
  .hintfab{position:fixed;right:14px;bottom:86px;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
     width:58px;height:58px;border-radius:50%;background:var(--panel);color:var(--gold);border:1px solid #4a3a24;
     box-shadow:0 6px 16px rgba(0,0,0,.5);cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;}
  .hintfab:active{transform:translateY(1px);}
  .hintfab .hicon{font-size:22px;line-height:1;}
  .hintfab .hlbl{font-size:9px;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;}
  .hintfab.busy{opacity:.55;}
  .hintfab.off{display:none;}
  .sq.hintfrom{box-shadow:inset 0 0 0 .5px var(--grid),inset 0 0 0 4px rgba(143,174,107,.85);}
  .sq.hintto::after{content:"";position:absolute;inset:15%;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(143,174,107,.92);animation:hintpulse 1s ease-in-out infinite;pointer-events:none;}
  @keyframes hintpulse{0%,100%{opacity:.5;}50%{opacity:1;}}

  /* board-only fullscreen */
  .fsx{position:fixed;top:14px;right:14px;z-index:30;display:none;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--panel);color:var(--ink);border:1px solid #4a3a24;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent;}
  body.boardfs{overflow:hidden;}
  body.boardfs .head,body.boardfs .controls,body.boardfs .tray,body.boardfs .status,body.boardfs #coach,body.boardfs #stats,body.boardfs .rulesbtn,body.boardfs .rules{display:none !important;}
  body.boardfs .wrap{max-width:none;padding:0;min-height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;}
  body.boardfs .play{--sz:min(96vw,92dvh,1000px);}
  body.boardfs .fsx{display:flex;}

  /* multi-capture route preview */
  .pathsvg{position:absolute;pointer-events:none;z-index:5;overflow:visible;display:none;}
  .capline{fill:none;stroke:rgba(224,122,58,.9);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 8;}
  .capline.hint{stroke:rgba(143,174,107,.95);}
  .moveline{fill:none;stroke:rgba(143,174,107,.6);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 6;}

  /* skins shop */
  .shop{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(8,6,4,.72);padding:16px;}
  .shop.show{display:flex;}
  .shopcard{background:var(--panel);border:1px solid #3a2f24;border-radius:16px;max-width:540px;width:100%;max-height:86vh;overflow:auto;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.6);}
  .shophead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  #shopwp{font-size:16px;color:var(--gold);font-weight:700;letter-spacing:.5px;}
  .shopx{background:transparent;border:none;color:var(--ink);font-size:20px;cursor:pointer;line-height:1;}
  .shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
  .scard{background:rgba(0,0,0,.22);border:1px solid #3a2f24;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:96px;}
  .scard.locked{opacity:.6;}
  .scard.eq{box-shadow:inset 0 0 0 2px var(--accent);}
  .scard.r-rare{border-color:#5a86c0;} .scard.r-epic{border-color:#c89a3a;} .scard.r-legendary{border-color:#c060e0;}
  .sname{font-size:13px;font-weight:600;color:var(--ink);}
  .sdesc{font-size:11px;color:var(--muted);line-height:1.35;}
  .swrow{display:flex;gap:5px;} .swd{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.35);}
  .sperk{font-size:10.5px;color:var(--accent);letter-spacing:.2px;}
  .sfoot{margin-top:auto;} .stag{font-size:11px;color:var(--muted);} .stag.ok{color:var(--accent);font-weight:600;}
  .scard .equip{padding:5px 12px;font-size:12px;}
  .shopnote{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.4;}
  .capdot{fill:rgba(224,122,58,.95);} .capdot.hint{fill:rgba(143,174,107,.95);}
  .sq.willeat::before{content:"";position:absolute;inset:16%;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(224,86,58,.95);animation:hintpulse 1s ease-in-out infinite;z-index:3;}
  .sq.willeathint::before{content:"";position:absolute;inset:16%;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(143,174,107,.95);animation:hintpulse 1s ease-in-out infinite;z-index:3;}
</style>
</head>
<body>
<div id="loading" class="loading">
  <div class="loadinner">
    <div class="lwm">دامة</div>
    <div class="lspin"></div>
    <div class="lsub">Dama · Lebanese draughts</div>
  </div>
</div>
<div class="wrap" id="wrap">
  <div class="head">
    <h1><span id="tTitle">Dama</span><span class="sub" id="tSub">Lebanese draughts</span></h1>
    <div class="headbtns">
      <span class="wordmark">دامة</span>
      <button class="btn primary" id="newgame">New game</button>
    </div>
  </div>

  <div class="controls">
    <select id="mode"><option value="pvp"></option><option value="ai"></option><option value="cvc"></option></select>
    <button class="btn" id="side" title="Tap to switch which colour you play"></button>
    <select id="diff"><option value="easy"></option><option value="med" selected></option><option value="hard"></option><option value="vhard"></option></select>
    <select id="style"><option value="classic"></option><option value="trad"></option></select>
    <button class="btn" id="undo"></button>
    <button class="btn" id="sound"></button>
    <button class="btn" id="music"></button>
    <button class="btn" id="coachbtn"></button>
    <button class="btn" id="fs"></button>
    <button class="btn" id="skins"></button>
  </div>

  <div class="tray"><div class="caps" id="capL"></div><div class="movebadge" id="move"></div><div class="caps right" id="capR"></div></div>

  <div class="status"><div id="statusMain" class="turn"></div><div class="count" id="count"></div></div>
  <div id="coach" class="coach"></div>
  <div id="stats" class="stats"></div>

  <div class="play">
    <div class="ranks" id="ranks"></div>
    <div class="frame"><div class="board" id="board"></div>
      <svg class="pathsvg" id="pathsvg"></svg>
      <div class="overlay" id="overlay"><div class="card"><h2 id="winTitle"></h2><p id="winSub"></p>
        <button class="btn primary" id="playAgain"></button></div></div>
    </div>
    <div class="files" id="files"></div>
  </div>

  <button class="rulesbtn" id="rulesbtn"></button>
  <div class="rules hidden" id="rules"></div>

// ================= engine =================
const SIZE=8, KING_DIRS=[[-1,0],[1,0],[0,-1],[0,1]];
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const clone=b=>b.map(row=>row.map(c=>c?{player:c.player,king:c.king}:null));
function initialBoard(){const b=Array.from({length:SIZE},()=>Array(SIZE).fill(null));
  for(let c=0;c<SIZE;c++){b[1][c]={player:2,king:false};b[2][c]={player:2,king:false};b[5][c]={player:1,king:false};b[6][c]={player:1,king:false};}return b;}
function singleCaptures(board,r,c,piece){const opts=[],enemy=piece.player===1?2:1;
  if(piece.king){for(const[dr,dc]of KING_DIRS){let nr=r+dr,nc=c+dc;while(inB(nr,nc)&&!board[nr][nc]){nr+=dr;nc+=dc;}
    if(!inB(nr,nc)||board[nr][nc].player!==enemy)continue;let lr=nr+dr,lc=nc+dc;
    while(inB(lr,lc)&&!board[lr][lc]){opts.push({capR:nr,capC:nc,landR:lr,landC:lc});lr+=dr;lc+=dc;}}}
  else{const fwd=piece.player===1?-1:1;for(const[dr,dc]of[[fwd,0],[0,-1],[0,1]]){const er=r+dr,ec=c+dc,lr=r+2*dr,lc=c+2*dc;
    if(inB(lr,lc)&&board[er]&&board[er][ec]&&board[er][ec].player===enemy&&!board[lr][lc])opts.push({capR:er,capC:ec,landR:lr,landC:lc});}}return opts;}
function captureSequences(board,r,c){const piece=board[r][c],out=[];
  (function rec(bd,cr,cc,captured,path,lastDir){const single=singleCaptures(bd,cr,cc,piece);let ext=false;
    for(const cap of single){
      const ddr=Math.sign(cap.landR-cr), ddc=Math.sign(cap.landC-cc);
      if(piece.king && lastDir && ddr===-lastDir[0] && ddc===-lastDir[1]) continue; // a king may not turn 180° between captures
      const nb=clone(bd);nb[cap.capR][cap.capC]=null;nb[cr][cc]=null;
      nb[cap.landR][cap.landC]={player:piece.player,king:piece.king};ext=true;
      rec(nb,cap.landR,cap.landC,captured.concat([{r:cap.capR,c:cap.capC}]),path.concat([{r:cap.landR,c:cap.landC}]),[ddr,ddc]);}
    if(!ext&&captured.length>0)out.push({captured,end:{r:cr,c:cc},path});})(board,r,c,[],[],null);return out;}
function normalMoves(board,r,c,piece){const d=[];
  if(piece.king){for(const[dr,dc]of KING_DIRS){let nr=r+dr,nc=c+dc;while(inB(nr,nc)&&!board[nr][nc]){d.push({r:nr,c:nc});nr+=dr;nc+=dc;}}}
  else{const fwd=piece.player===1?-1:1;for(const[dr,dc]of[[fwd,0],[0,-1],[0,1]]){const nr=r+dr,nc=c+dc;if(inB(nr,nc)&&!board[nr][nc])d.push({r:nr,c:nc});}}return d;}
function computeLegal(board,player){const capBy={};let anyCap=false;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const p=board[r][c];if(!p||p.player!==player)continue;
    const seqs=captureSequences(board,r,c);if(seqs.length){capBy[r+','+c]=seqs;anyCap=true;}}
  const moves={};
  if(anyCap){for(const k in capBy){moves[k]=capBy[k].map(s=>({r:s.end.r,c:s.end.c,captured:s.captured,path:s.path}));}return{mustCapture:true,moves};}
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){const p=board[r][c];if(!p||p.player!==player)continue;
    const nm=normalMoves(board,r,c,p);if(nm.length)moves[r+','+c]=nm.map(d=>({r:d.r,c:d.c,captured:null,path:null}));}
  return{mustCapture:false,moves};}
function countPieces(board,player){let n=0;for(const row of board)for(const c of row)if(c&&c.player===player)n++;return n;}
function allMoves(board,player){const lg=computeLegal(board,player);const list=[];
  for(const k in lg.moves){const p=k.split(',').map(Number);for(const m of lg.moves[k])list.push({from:p,to:[m.r,m.c],captured:m.captured,path:m.path});}return list;}
function makeMove(board,mv){const nb=clone(board);const fr=mv.from[0],fc=mv.from[1];
  const piece={player:nb[fr][fc].player,king:nb[fr][fc].king};nb[fr][fc]=null;
  if(mv.captured)for(const cap of mv.captured)nb[cap.r][cap.c]=null;
  const backRow=piece.player===1?0:7;if(!piece.king&&mv.to[0]===backRow)piece.king=true;
  nb[mv.to[0]][mv.to[1]]=piece;return nb;}

// ================= AI =================
function evalPlayer(board,player){
  // material + positional score, from `player`'s point of view
  let mine=0,opp=0,myPieces=0,oppPieces=0;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=board[r][c];if(!p)continue;
    let v=p.king?360:100;
    if(!p.king){
      const adv=p.player===1?(6-r):(r-1);
      v+=Math.max(0,adv)*8;                                          // push men toward promotion
      if((p.player===1&&r===6)||(p.player===2&&r===1))v+=10;         // one row from king
      if((p.player===1&&r===7)||(p.player===2&&r===0))v+=16;         // hold back rank (blocks enemy kings)
      v+=(3.5-Math.abs(c-3.5))*2.2;                                  // central files
      if(c===0||c===7)v+=3;                                          // edge men are harder to capture
    } else {
      v+=(3.5-Math.abs(c-3.5))*3+(3.5-Math.abs(r-3.5))*3;            // centralised kings dominate
    }
    if(p.player===player){mine+=v;myPieces++;} else {opp+=v;oppPieces++;}
  }
  let s=mine-opp;
  if(myPieces>oppPieces) s+=(myPieces-oppPieces)*6;                  // when ahead, favour trading down
  return s;
}
function orderMoves(m){m.sort(function(a,b){
  const ca=a.captured?a.captured.length:0, cb=b.captured?b.captured.length:0;
  if(cb!==ca)return cb-ca;                                           // most captures first
  const pa=(a.to[0]===0||a.to[0]===7)?1:0, pb=(b.to[0]===0||b.to[0]===7)?1:0;
  return pb-pa;                                                      // then promotions
});return m;}
function nega(board,player,depth,alpha,beta,deadline){
  if(performance.now()>deadline) throw 0;
  const moves=allMoves(board,player);
  if(!moves.length) return -99999-depth;                            // no legal move = loss for side to move
  const forcedCapture = moves[0].captured!=null;                    // captures are mandatory → covers all moves
  // Quiescence: don't stop evaluating in the middle of a forced capture exchange (kills the horizon effect)
  if(depth<=0 && !forcedCapture) return evalPlayer(board,player);
  orderMoves(moves);
  let best=-Infinity;
  for(const mv of moves){
    const val=-nega(makeMove(board,mv),player===1?2:1,depth-1,-beta,-alpha,deadline);
    if(val>best)best=val; if(best>alpha)alpha=best; if(alpha>=beta)break;
  }
  return best;
}
function search(board,player,budgetMs,maxDepth){
  const other=player===1?2:1;
  let scored=orderMoves(allMoves(board,player)).map(function(mv){return {mv:mv,val:0};});
  if(!scored.length)return null; if(scored.length===1)return scored[0].mv;
  const deadline=performance.now()+budgetMs;
  let stable=scored.slice();
  for(let depth=2;depth<=maxDepth;depth++){
    let aborted=false;
    for(const item of scored){
      try{ item.val=-nega(makeMove(board,item.mv),other,depth-1,-Infinity,Infinity,deadline); }
      catch(e){ aborted=true; break; }
    }
    if(aborted) break;                                              // keep last fully-completed depth (in `stable`)
    scored.sort(function(a,b){return b.val-a.val;});                // best-first ordering deepens next pass faster
    stable=scored.slice();
    if(performance.now()>deadline) break;
  }
  // Among moves that are essentially equal to the best, prefer whatever has worked in past games (learning).
  const pos=posKey(board,player), top=stable[0].val;
  const near=stable.filter(function(x){return x.val>=top-8;});
  let bestLS=-Infinity; for(const x of near){const ls=learnScore(pos,x.mv); if(ls>bestLS)bestLS=ls;}
  const pick=near.filter(function(x){return learnScore(pos,x.mv)===bestLS;});
  return pick[Math.floor(Math.random()*pick.length)].mv;
}
function aiMove(board,player){
  const total=countPieces(board,1)+countPieces(board,2);
  if(diff==='easy'){ const m=allMoves(board,player); if(!m.length)return null; orderMoves(m);
    return Math.random()<0.4 ? m[Math.floor(Math.random()*m.length)] : search(board,player,90,3); }
  if(diff==='med')  return search(board,player,500,  total<=10?10:7);
  if(diff==='hard') return search(board,player,1400, total<=10?14:10);
  return search(board,player,2400, total<=12?22:16); // very hard
}

let LEARN={games:0,book:{}};
function loadLearn(){ try{const s=localStorage.getItem('dama-learn'); if(s){const o=JSON.parse(s); if(o&&o.book){LEARN=o;LEARN.book=LEARN.book||{};LEARN.games=LEARN.games||0;}}}catch(e){} }
function saveLearn(){ try{ const ks=Object.keys(LEARN.book);
    if(ks.length>4000){ for(let i=0;i<ks.length-3000;i++) delete LEARN.book[ks[i]]; }
    localStorage.setItem('dama-learn',JSON.stringify(LEARN)); }catch(e){} }
function posKey(board,turn){ let s=''; for(let r=0;r<8;r++){const row=board[r]; for(let c=0;c<8;c++){const p=row[c]; s+= !p?'.':(p.player===1?(p.king?'L':'l'):(p.king?'D':'d'));}} return s+turn; }
function moveKey(mv){ return mv.from[0]+''+mv.from[1]+'>'+mv.to[0]+''+mv.to[1]; }
function learnScore(pos,mv){ const b=LEARN.book[pos]; if(!b)return 0; const e=b[moveKey(mv)]; if(!e||e[0]<2)return 0; return e[1]/e[0]; }
let moveTrail=[];
function recordMove(prevBoard,mover,mv){ if(moveTrail.length<24) moveTrail.push({pos:posKey(prevBoard,mover),mk:moveKey(mv),mover:mover}); }
function learnFromGame(winner){ try{
    for(const tr of moveTrail){ let b=LEARN.book[tr.pos]; if(!b){b={};LEARN.book[tr.pos]=b;} let e=b[tr.mk]; if(!e){e=[0,0];b[tr.mk]=e;}
      e[0]++; e[1]+= winner? (tr.mover===winner?1:-1) : 0; }
    LEARN.games++; saveLearn(); }catch(e){} moveTrail=[]; }

function sameMove(a,b){ return a.from[0]===b.from[0]&&a.from[1]===b.from[1]&&a.to[0]===b.to[0]&&a.to[1]===b.to[1]; }
function analyzeLoss(prevBoard,player,playedMv){
  const other=player===1?2:1, dl=performance.now()+200, depth=8;
  let best=-Infinity, played=null;
  const moves=orderMoves(allMoves(prevBoard,player));
  for(const m of moves){ let v; try{v=-nega(makeMove(prevBoard,m),other,depth-1,-Infinity,Infinity,dl);}catch(e){v=null;}
    if(v===null)continue; if(v>best)best=v; if(sameMove(m,playedMv))played=v; }
  if(best===-Infinity) return null;
  if(played===null) played=best;
  return Math.max(0,best-played);
}
function classify(loss){ if(loss<=12)return'best'; if(loss<=45)return'good'; if(loss<=110)return'inacc'; if(loss<=260)return'mistake'; return'blunder'; }
function coachOnMove(prevBoard,mover,mv){ if(!coachOn)return;
  let loss; try{loss=analyzeLoss(prevBoard,mover,mv);}catch(e){loss=null;}
  if(loss===null)return; const k=classify(loss);
  if(coachStats)coachStats[k]=(coachStats[k]||0)+1; showCoach(k); }

function initAudio(){ if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}

function tone(freq,dur,type,vol,when){ if(!audioCtx)return;const t=when||audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+0.03);}
function noise(dur,vol){ if(!audioCtx)return;const n=audioCtx.createBufferSource();
  const b=audioCtx.createBuffer(1,Math.floor(audioCtx.sampleRate*dur),audioCtx.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;
  const g=audioCtx.createGain();g.gain.value=vol||0.1;n.connect(g).connect(audioCtx.destination);n.start();}

// ============ background music (procedural, offline — soft Hijaz-mode loop) ============
const M_PHRASES=[
  [0,2,3,4, 3,2,0,null, 4,3,2,4, 5,4,3,null],
  [7,5,4,3, 4,5,7,null, 5,4,3,2, 3,4,5,null],
  [0,3,2,4, 3,5,4,null, 3,2,0,-3, 0,2,3,null],
  [4,5,4,3, 2,3,4,null, 2,0,-1,0, 2,3,2,null]
];
let mPhrase=0, mPos=0, mOct=0;
function mNoteFreq(i){ const base=[293.66,311.13,369.99,392.00,440.00,466.16,554.37]; // D Hijaz
  const oct=Math.floor(i/base.length), idx=((i%base.length)+base.length)%base.length;
  return base[idx]*Math.pow(2,oct); }
function mPad(freq,when,dur,vol){ if(!audioCtx||!musicGain)return;
  const o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain();
  o1.type='sine';o2.type='triangle';o1.frequency.value=freq;o2.frequency.value=freq*1.004;
  g.gain.setValueAtTime(0.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+0.16);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o1.connect(g);o2.connect(g);g.connect(musicGain);
  o1.start(when);o2.start(when);o1.stop(when+dur+0.05);o2.stop(when+dur+0.05); }
function startMusic(){ if(!audioCtx||musicTimer)return;
  if(!musicGain){musicGain=audioCtx.createGain();musicGain.gain.value=0.8;musicGain.connect(audioCtx.destination);}
  const stepDur=0.5; let nextTime=audioCtx.currentTime+0.15;
  musicTimer=setInterval(function(){ if(!audioCtx)return; const now=audioCtx.currentTime;
    while(nextTime<now+0.6){ const phrase=M_PHRASES[mPhrase];
      if(mPos===0){ mPad(73.42,nextTime,stepDur*7.6,0.05); mPad(110.00,nextTime,stepDur*3.6,0.03); } // drones per phrase
      const step=phrase[mPos];
      if(step!==null&&step!==undefined){
        mPad(mNoteFreq(step+mOct*7),nextTime,stepDur*1.9,0.04+Math.random()*0.015);
        if(Math.random()<0.14) mPad(mNoteFreq(step+mOct*7+2),nextTime+stepDur*0.5,stepDur*0.9,0.022); // soft ornament
      }
      mPos++;
      if(mPos>=phrase.length){ mPos=0;
        let n; do{ n=Math.floor(Math.random()*M_PHRASES.length); }while(n===mPhrase&&M_PHRASES.length>1); mPhrase=n;
        mOct = Math.random()<0.22 ? 1 : (Math.random()<0.15 ? -1 : 0); }
      nextTime+=stepDur; } },140); }
function stopMusic(){ if(musicTimer){clearInterval(musicTimer);musicTimer=null;} }

function drawPaths(capMoves,hintMv,normMoves){ const svg=$('pathsvg'); if(!svg)return;
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  const bw=boardEl.clientWidth, bh=boardEl.clientHeight, cell=bw/8;
  const hasAny=(capMoves&&capMoves.length)||hintMv||(normMoves&&normMoves.length);
  if(!hasAny||!bw){svg.style.display='none';return;}
  svg.style.left=(boardEl.offsetLeft+boardEl.clientLeft)+'px';
  svg.style.top=(boardEl.offsetTop+boardEl.clientTop)+'px';
  svg.style.width=bw+'px'; svg.style.height=bh+'px';
  svg.setAttribute('viewBox','0 0 '+bw+' '+bh); svg.style.display='block';
  const ns='http://www.w3.org/2000/svg';
  function line(pts,cls){ let d=''; pts.forEach(function(p,i){ const dp=disp(p.r,p.c); d+=(i?'L':'M')+((dp.c+0.5)*cell)+' '+((dp.r+0.5)*cell)+' '; });
    const pa=document.createElementNS(ns,'path'); pa.setAttribute('d',d.trim()); pa.setAttribute('class',cls); svg.appendChild(pa); }
  function dot(p,cls){ const dp=disp(p.r,p.c); const c=document.createElementNS(ns,'circle'); c.setAttribute('cx',(dp.c+0.5)*cell); c.setAttribute('cy',(dp.r+0.5)*cell); c.setAttribute('r',cell*0.08); c.setAttribute('class',cls); svg.appendChild(c); }
  // plain-move paths (drawn beneath capture routes)
  if(normMoves) normMoves.forEach(function(mv){ line([{r:mv.from[0],c:mv.from[1]},{r:mv.to[0],c:mv.to[1]}],'moveline'); });
  // capture routes (selected = orange, hint = green), with a dot at each landing
  const groups=[]; if(capMoves&&capMoves.length)groups.push({moves:capMoves,cls:''}); if(hintMv)groups.push({moves:[hintMv],cls:' hint'});
  groups.forEach(function(g){ g.moves.forEach(function(mv){ if(!mv.captured)return;
    const pts=[{r:mv.from[0],c:mv.from[1]}].concat(mv.path&&mv.path.length?mv.path:[{r:mv.to[0],c:mv.to[1]}]);
    line(pts,'capline'+g.cls); pts.forEach(function(p,i){ if(i)dot(p,'capdot'+g.cls); });
  }); });
}

function handleCell(r,c){ initAudio();
  if(winner||thinking||animating)return;
  if(mode==='ai'&&turn!==humanSide)return;
  const key=r+','+c,cell=board[r][c];
  if(selected){const list=legal.moves[selected.join(',')]||[];const mv=list.find(m=>m.r===r&&m.c===c);
    if(mv){apply({from:selected,to:[r,c],captured:mv.captured,path:mv.path});return;}}
  if(cell&&cell.player===turn&&legal.moves[key]){selected=(selected&&selected[0]===r&&selected[1]===c)?null:[r,c];render();return;}
  selected=null;render();
}

function apply(mv){
  const prev=clone(board);
  const mover=turn;
  history.push({board:prev,turn,lastMove});
  recordMove(prev,mover,mv);                                   // remember move for learning
  board=makeMove(board,mv);lastMove={from:mv.from,to:mv.to};selected=null;hint=null;
  const wasMan=!prev[mv.from[0]][mv.from[1]].king;
  const promoted=wasMan&&board[mv.to[0]][mv.to[1]].king;
  const next=turn===1?2:1;turn=next;legal=computeLegal(board,turn);
  const over=countPieces(board,next)===0||Object.keys(legal.moves).length===0;
  animating=true;render();
  const moverHuman = mode==='pvp' || (mode==='ai'&&mover===humanSide);
  if(moverHuman && coachOn) setTimeout(function(){ coachOnMove(prev,mover,mv); },260); // rate move AFTER it registers (non-blocking)
  animateMove(mv,prev,promoted,()=>{animating=false;
    if(over){finishGame(next===1?2:1);}else{render();maybeAI();}});
}

  const piece=destSq?destSq.querySelector('.piece'):null;
  const dTo=disp(mv.to[0],mv.to[1]);
  const positions=[{r:mv.from[0],c:mv.from[1]}].concat(mv.path&&mv.path.length?mv.path:[{r:mv.to[0],c:mv.to[1]}]);
  const segs=positions.length-1;
  const perSeg=mv.captured?150:150;
  const total=Math.max(perSeg,segs*perSeg);

  const ghosts=[];
  if(mv.captured)mv.captured.forEach((cap,i)=>{const sq=boardEl.children[dIndex(cap.r,cap.c)];const victim=prevBoard[cap.r][cap.c];
    if(sq&&victim){const g=document.createElement('div');g.className='piece '+(victim.player===1?'l':'d')+(victim.king?' king':'');
      g.style.transition='opacity .22s ease, transform .22s ease';sq.appendChild(g);ghosts.push({el:g,idx:i});}});

  const finish=()=>{ghosts.forEach(({el})=>el.remove());if(destSq)destSq.classList.remove('moving');
    if(promoted&&piece){sPromote();piece.classList.add('promoting');setTimeout(()=>{piece.classList.remove('promoting');if(done)done();},640);}
    else if(done)done();};

  if(!mv.captured)sMove();
  ghosts.forEach(({el,idx})=>setTimeout(()=>{el.style.opacity='0';el.style.transform='scale(.35)';sCapture();},Math.max(0,Math.round((idx+1)/segs*total)-60)));

  if(piece&&piece.animate){destSq.classList.add('moving');
    const kf=positions.map(p=>{const dp=disp(p.r,p.c);return{transform:'translate('+((dp.c-dTo.c)*cell)+'px,'+((dp.r-dTo.r)*cell)+'px)'};});
    const anim=piece.animate(kf,{duration:total,easing:segs>1?'ease-in-out':'cubic-bezier(.22,.61,.36,1)'});
    anim.onfinish=finish;anim.oncancel=finish;
  } else { setTimeout(finish,total+40); }
}

function maybeAI(){ if(winner)return;
  const aiTurn=(mode==='ai'&&turn!==humanSide)||mode==='cvc';
  if(!aiTurn)return;
  thinking=true;render();
  const pace=(mode==='cvc')?600:30, g=gameId;
  setTimeout(()=>{if(g!==gameId||winner){thinking=false;return;}
    const mv=aiMove(board,turn);
    if(g!==gameId)return;
    thinking=false;
    if(!mv){finishGame(turn===1?2:1);return;}apply(mv);},pace);}

function showWin(){const t=T[lang];const youWon=mode==='ai'&&winner===humanSide;const w=winner===1?t.light:t.dark;
  $('winTitle').textContent=lang==='ar'?(t.wins+' '+w):(w+' '+t.wins);
  let sub=mode==='ai'?(youWon?t.youWon:t.youLost):t.niceGame;
  const cs=coachSummaryText(); if(cs) sub+=' — '+cs;
  if(pendingUnlock&&pendingUnlock.length) sub+='  🎉 Unlocked: '+pendingUnlock.join(', ');
  $('winSub').textContent=sub; overlay.classList.add('show'); showCoachIdle();}

function undo(){ if(thinking||animating||!history.length)return;
  let prev=history.pop();
  if(mode==='ai'&&prev.turn!==humanSide&&history.length)prev=history.pop();
  board=prev.board;turn=prev.turn;lastMove=prev.lastMove;selected=null;winner=null;
  overlay.classList.remove('show');refresh();}

// ================= wire up =================
$('newgame').addEventListener('click',()=>{initAudio();newGame();});
$('playAgain').addEventListener('click',()=>{initAudio();newGame();});
$('undo').addEventListener('click',undo);
$('sound').addEventListener('click',()=>{soundOn=!soundOn;initAudio();$('sound').textContent=soundOn?T[lang].soundOn:T[lang].soundOff;});
$('music').addEventListener('click',()=>{musicOn=!musicOn;if(musicOn){initAudio();startMusic();}else{stopMusic();}$('music').textContent=musicOn?T[lang].musicOn:T[lang].musicOff;});
$('coachbtn').addEventListener('click',()=>{coachOn=!coachOn;$('coachbtn').textContent=coachOn?T[lang].coachOn:T[lang].coachOff;showCoachIdle();});
$('fs').addEventListener('click',toggleBoardFS);
$('fsx').addEventListener('click',toggleBoardFS);
$('hintfab').addEventListener('click',showHint);
$('skins').addEventListener('click',openShop);
$('shopclose').addEventListener('click',closeShop);
$('shop').addEventListener('click',function(e){ if(e.target===$('shop'))closeShop(); });
$('shopgrid').addEventListener('click',function(e){ var b=e.target.closest('.equip'); if(b){ STATS.equipped=b.getAttribute('data-id'); saveStats(); applySkin(STATS.equipped); renderShop(); } });
function onFSChange(){ if(!document.fullscreenElement) document.body.classList.remove('boardfs'); updateFSLabel(); render(); }
document.addEventListener('fullscreenchange',onFSChange);
document.addEventListener('webkitfullscreenchange',onFSChange);
['mode','diff','style'].forEach(id=>$(id).addEventListener('change',()=>{initAudio();newGame();}));
$('side').addEventListener('click',()=>{initAudio();doSideToggle();});
$('rulesbtn').addEventListener('click',function(){const el=$('rules');el.classList.toggle('hidden');
  this.textContent=el.classList.contains('hidden')?T[lang].howto:T[lang].hide;});
window.addEventListener('pointerdown',initAudio,{once:true});

loadLearn();
loadStats();
applySkin(STATS.equipped||'wood');
applyLang();
newGame();
updateHintVisibility();
